name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy SSH key
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_KEY is not configured in repo secrets — deploy did not run."
            echo "ready=no" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit 1
            fi
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload site archive
        if: steps.check.outputs.ready == 'yes'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST || '179.198.216.71' }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
          DOCROOT: ${{ vars.DEPLOY_DOCROOT_PATH || '/var/www/devicevaultspot.com' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          tar -cf /tmp/devicevaultspot.tar --exclude=.git --exclude=scripts/__pycache__ .
          scp -i ~/.ssh/id_deploy /tmp/devicevaultspot.tar "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/devicevaultspot.tar"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DOCROOT}' && tar -xf /tmp/devicevaultspot.tar && test -f it/velice/landing.html && echo DEPLOY_OK:${DOCROOT}"

      - name: Verify velice hero on live site
        if: steps.check.outputs.ready == 'yes'
        run: |
          for i in $(seq 1 12); do
            if curl -sf --max-time 20 "https://devicevaultspot.com/it/velice/landing.html" | grep -q 'stendini occupano il salotto'; then
              echo "Live site has new LINVO hero copy"
              exit 0
            fi
            sleep 10
          done
          echo "Hero copy not yet visible on live site"
          exit 1